<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EEDC">
<title>Tracechain</title>
<style>
:root{--bg:#F5EEDC;--card:#FFFBF1;--ink:#1B2B45;--muted:#6B7287;--line:#E3D7BC;--blue:#2457A6;--blue-soft:#DCE6F5;--red:#C23B30;--red-soft:#F6D9D4;--sand:#EBDDB8;--r:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:2px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;color:var(--blue)}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--red);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)}
#who{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:660px;margin:0 auto;padding:16px}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:17px;color:var(--blue)}
.sub{margin:0 0 12px;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;margin:12px 0 5px;color:var(--ink)}
input,select{width:100%;font:inherit;font-size:16px;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);outline:0}
input:focus,select:focus{border-color:var(--blue)}
.btn{display:block;width:100%;margin-top:14px;padding:13px;border:2px solid var(--blue);border-radius:14px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:transparent;color:var(--blue)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red.alt{background:transparent;color:var(--red)}
.btn.small{display:inline-block;width:auto;margin:8px 8px 0 0;padding:6px 14px;font-size:13px;border-radius:999px}
.filebtn{display:block;margin-top:8px;padding:10px;border:2px dashed var(--blue);border-radius:14px;text-align:center;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer}
.filebtn input{display:none}
.out{margin-top:14px;font-size:14px;word-break:break-word}
.out:empty{display:none}
.out.err{background:var(--red-soft);color:var(--red);padding:10px 14px;border-radius:14px;font-weight:600}
.out.ok{background:var(--blue-soft);color:var(--blue);padding:10px 14px;border-radius:14px;font-weight:600}
.badge{text-align:center;font-weight:800;font-size:17px;padding:14px;border-radius:16px;margin-bottom:10px}
.badge small{display:block;font-weight:600;font-size:12px;margin-top:2px}
.badge.good{background:var(--blue-soft);color:var(--blue)}
.badge.bad{background:var(--red-soft);color:var(--red)}
.badge.warn{background:var(--sand);color:var(--ink)}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row span{color:var(--muted);flex:0 0 36%}
.row b{text-align:right;flex:1;min-width:0;word-break:break-word;font-weight:600}
code{font:12px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:var(--sand);padding:2px 7px;border-radius:8px;cursor:pointer}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 4px;font-weight:800}
.item{border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;background:var(--bg)}
.item .t{font-weight:700}.item .m{font-size:12px;color:var(--muted)}
.tl{border-left:4px solid var(--sand);margin:8px 0 0 8px;padding-left:14px}
.tl .item{position:relative}
.tl .item::before{content:"";position:absolute;left:-26px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid var(--bg)}
.tl .item.flag::before{background:var(--red)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--sand)}
.pill.good{background:var(--blue-soft);color:var(--blue)}.pill.bad{background:var(--red-soft);color:var(--red)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:636px;margin:0 auto;background:var(--card);border:2px solid var(--line);border-radius:22px;display:flex;padding:6px;z-index:20}
nav button{flex:1;background:none;border:0;border-radius:16px;color:var(--muted);padding:8px 2px;font-size:11px;font-weight:700;cursor:pointer}
nav button span{display:block;font-size:19px}
nav button.active{background:var(--blue);color:#fff}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.show{opacity:1}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
.login{max-width:440px;margin:6vh auto 0}
.login h1{color:var(--blue);margin:0 0 6px;font-size:28px}
.cred{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:9px 12px;margin:8px 0;background:var(--bg);cursor:pointer;font-size:13px}
.cred:hover{border-color:var(--blue)}
.cred b{display:block;font-size:14px}
</style>
</head>
<body>
<div id="app"><div style="padding:40px 20px;text-align:center;color:#2457A6;font-weight:700">Loading Tracechain…<div id="loaderr" style="margin-top:12px;color:#C23B30;font-size:13px;font-weight:600"></div></div></div>
<div id="toast"></div>
<script>
window.__err=function(m){var e=document.getElementById('loaderr');if(e)e.textContent='Error: '+m;else{var t=document.getElementById('toast');if(t){t.textContent='Error: '+m;t.className='show'}}};
window.addEventListener('error',function(e){window.__err(e.message)});
window.addEventListener('unhandledrejection',function(e){window.__err(e.reason&&e.reason.message||e.reason)});
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var short=function(h){return h?h.slice(0,8)+'…'+h.slice(-6):''};

/* ---------- demo credentials (no real keys) ---------- */
var USERS=[
 {email:'admin@demo.tracechain',pass:'demo1234',addr:'0xAD00000000000000000000000000000000000001',name:'Network Admin',type:'Admin',country:'IN'},
 {email:'hospital@demo.tracechain',pass:'demo1234',addr:'0xB100000000000000000000000000000000000002',name:'City Hospital',type:'Hospital',country:'IN'},
 {email:'lab@demo.tracechain',pass:'demo1234',addr:'0xC200000000000000000000000000000000000003',name:'Helix Laboratory',type:'Laboratory',country:'IN'},
 {email:'courier@demo.tracechain',pass:'demo1234',addr:'0xD300000000000000000000000000000000000004',name:'ColdRoute Courier',type:'Courier',country:'IN'},
 {email:'auditor@demo.tracechain',pass:'demo1234',addr:'0xE400000000000000000000000000000000000005',name:'Health Auditor',type:'Auditor',country:'IN'}
];
var CONTRACT='0xDEM0C0NTRACT00000000000000000000TRACE01';
var RPC='demo://tracechain.local (in-browser chain)';

/* ---------- demo chain ---------- */
var S={orgs:{},samples:{},hist:{},paused:false,seq:0},me=null,tab='trace';
function save(){try{localStorage.setItem('tc_state',JSON.stringify(S))}catch(e){}}
function safeLS(){try{return window.localStorage}catch(e){return null}}
function sha(str){
 if(window.crypto&&window.crypto.subtle)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(hex);
 var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return Promise.resolve(('00000000'+(h>>>0).toString(16)).slice(-8).repeat(8));
}
function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
function shaFile(f){return f.arrayBuffer().then(function(b){return crypto.subtle.digest('SHA-256',b)}).then(function(d){return '0x'+hex(d)})}
function org(a){return S.orgs[a]||null}
function nm(a){var o=org(a);return o?o.name:short(a)}
function fail(m){throw new Error(m)}
function bio(t){return t==='Hospital'||t==='Laboratory'||t==='Research'}
function actor(){if(!me)fail('Log in first.');if(S.paused)fail('Contract is paused.');if(me.type==='Admin')return me.addr;var o=org(me.addr);if(!o||!o.active)fail('Your organization is not active.');return me.addr}
function smp(id){var s=S.samples[id];if(!s)fail('Sample not found.');return s}
function mustHold(s){if(s.custodian!==me.addr)fail('Only the current custodian can do this.')}
function live(s){if(s.status!=='Active'&&s.status!=='Quarantined')fail('Sample is '+s.status+'.')}
function add(id,type,note,data){
 var h=S.hist[id],prev=h.length?h[h.length-1].hash:id;
 var r={type:type,actor:me.addr,ts:Date.now()+(S.seq++),data:data||'',note:note||'',prev:prev};
 return sha(JSON.stringify([r.type,r.actor,r.ts,r.data,r.note,r.prev])).then(function(x){r.hash='0x'+x;h.push(r);S.samples[id].head=r.hash;save();return r});
}
function ids(a){return Object.keys(S.samples).filter(function(i){return a(S.samples[i])})}

var A={
 register:function(l,t,date,subj,consent,note){actor();if(!bio(me.type))fail('Only hospitals, labs and research orgs can register samples.');if(!l||!t)fail('Label and type are required.');
  return sha(me.addr+l).then(function(x){var id='0x'+x;if(S.samples[id])fail('Sample already exists.');
   return sha(subj||'').then(function(sh){S.samples[id]={id:id,label:l,type:t,origin:me.addr,creator:me.addr,collected:date||new Date().toISOString().slice(0,10),consent:consent||'',subject:'0x'+sh,parent:'',custodian:me.addr,pending:'',status:'Active',head:''};S.hist[id]=[];
    return add(id,'Collected',note,consent).then(function(){return 'Registered. ID: '+id})})})},
 storage:function(id,loc,temp,note){actor();var s=smp(id);mustHold(s);live(s);if(!loc)fail('Location required.');if(temp!==''&&(temp<-300||temp>150))fail('Temperature out of range.');return add(id,'Storage',loc+(temp!==''?' @ '+temp+'°C':'')+(note?' · '+note:''))},
 handling:function(id,act,note){actor();var s=smp(id);mustHold(s);live(s);if(!act)fail('Action required.');return add(id,'Handling',act+(note?' · '+note:''))},
 test:function(id,name,h){actor();var s=smp(id);mustHold(s);live(s);if(me.type!=='Laboratory'&&me.type!=='Research')fail('Only labs and research orgs can record tests.');if(!name||!h)fail('Test name and report hash required.');return add(id,'Test',name,h.toLowerCase())},
 incident:function(id,d,h){actor();var s=smp(id);if(s.status==='Consumed'||s.status==='Destroyed')fail('Sample is final.');if(me.addr!==s.custodian&&me.addr!==s.pending&&me.type!=='Auditor')fail('Not allowed to report on this sample.');if(!d)fail('Describe the incident.');return add(id,'Incident',d,h)},
 aliquot:function(id,l,t,note){actor();var p=smp(id);mustHold(p);live(p);if(!bio(me.type))fail('Not allowed.');if(!l||!t)fail('Label and type required.');
  return sha(me.addr+l).then(function(x){var cid='0x'+x;if(S.samples[cid])fail('Label already used.');var c=JSON.parse(JSON.stringify(p));c.id=cid;c.label=l;c.type=t;c.creator=me.addr;c.parent=id;c.pending='';c.status='Active';c.head='';S.samples[cid]=c;S.hist[cid]=[];
   return add(id,'AliquotCreated',l,cid).then(function(){return add(cid,'DerivedFrom',note,id)}).then(function(){return 'Aliquot created. ID: '+cid})})},
 send:function(id,to,note){actor();var s=smp(id);mustHold(s);if(s.status!=='Active')fail('Only active samples can be sent.');var r=org(to);if(!r||!r.active||r.type==='Auditor'||to===me.addr)fail('Invalid recipient.');s.status='In transit';s.pending=to;return add(id,'TransferInitiated',note,to)},
 cancel:function(id){actor();var s=smp(id);mustHold(s);if(s.status!=='In transit')fail('No pending transfer.');s.status='Active';s.pending='';return add(id,'TransferCancelled','')},
 accept:function(id,ok,note){actor();var s=smp(id);if(s.status!=='In transit')fail('Sample is '+s.status+'.');if(s.pending!==me.addr)fail('You are not the recipient.');s.custodian=me.addr;s.pending='';s.status=ok?'Active':'Quarantined';return add(id,'TransferAccepted',(ok?'':'DAMAGED · ')+note,ok?'1':'0')},
 reject:function(id,note){actor();var s=smp(id);if(s.status!=='In transit')fail('Sample is '+s.status+'.');if(s.pending!==me.addr)fail('You are not the recipient.');s.pending='';s.status='Active';return add(id,'TransferRejected',note)},
 quarantine:function(id,note){actor();var s=smp(id);if(s.status!=='Active'&&s.status!=='In transit')fail('Cannot quarantine a '+s.status+' sample.');if(me.type!=='Auditor'&&me.addr!==s.custodian)fail('Not allowed.');s.status='Quarantined';return add(id,'Quarantined',note)},
 release:function(id,note){actor();var s=smp(id);if(s.status!=='Quarantined')fail('Sample is not quarantined.');if(me.type!=='Auditor'&&me.type!=='Admin')fail('Only an auditor or admin can release.');s.status='Active';return add(id,'Released',note)},
 consume:function(id,r){actor();var s=smp(id);mustHold(s);live(s);if(me.type!=='Laboratory'&&me.type!=='Research')fail('Only labs and research orgs can consume.');s.status='Consumed';return add(id,'Consumed',r)},
 destroy:function(id,r){actor();var s=smp(id);mustHold(s);if(!bio(me.type))fail('Not allowed.');s.status='Destroyed';return add(id,'Destroyed',r)},
 regOrg:function(a,n,c,t){actor();if(me.type!=='Admin')fail('Admin only.');if(!a||!n||!c||!t)fail('All fields are required.');if(org(a))fail('Already registered.');S.orgs[a]={name:n,type:t,country:c.toUpperCase(),active:true};save();return 'Organization registered.'},
 active:function(a,v){actor();if(me.type!=='Admin')fail('Admin only.');var o=org(a);if(!o)fail('Unknown organization.');o.active=!!v;save();return o.name+(v?' reinstated.':' suspended.')},
 reassign:function(id,to,r){actor();if(me.type!=='Admin')fail('Admin only.');var s=smp(id);if(s.status==='Consumed'||s.status==='Destroyed')fail('Sample is final.');var o=org(to);if(!o||!o.active||o.type==='Auditor')fail('Invalid new custodian.');s.custodian=to;s.pending='';if(s.status==='In transit')s.status='Active';return add(id,'AdminReassigned',r,to)},
 pause:function(v){if(!me||me.type!=='Admin')fail('Admin only.');S.paused=v;save();return v?'Contract paused.':'Contract resumed.'}
};

/* ---------- seed ---------- */
function seed(){
 USERS.forEach(function(u){if(u.type!=='Admin')S.orgs[u.addr]={name:u.name,type:u.type,country:u.country,active:true}});
 var H=USERS[1],L=USERS[2],steps=[
  function(){me=H;return A.register('H-001','Whole blood','2026-09-28','P-0042','','Collected at ward 3')},
  function(){return A.storage(Object.keys(S.samples)[0],'Freezer A2, shelf 3','-80','')},
  function(){return A.send(Object.keys(S.samples)[0],L.addr,'Dry ice, AWB 1234')}];
 return steps.reduce(function(p,f){return p.then(f)},Promise.resolve()).then(function(){me=null;S.demoId=Object.keys(S.samples)[0];save()});
}

/* ---------- verification ---------- */
function verify(id){
 var h=S.hist[id]||[],prev=id,i=0;
 function next(){if(i>=h.length)return Promise.resolve(h.length>0);var r=h[i];if(r.prev!==prev)return Promise.resolve(false);
  return sha(JSON.stringify([r.type,r.actor,r.ts,r.data,r.note,r.prev])).then(function(x){if('0x'+x!==r.hash)return false;prev=r.hash;i++;return next()})}
 return next();
}

/* ---------- UI ---------- */
function toast(m){var t=$('toast');t.textContent=m;t.className='show';setTimeout(function(){t.className=''},1600)}
function show(id,html,cls){var o=$(id);o.className='out '+(cls||'');o.innerHTML=html}
function row(k,v){return'<div class="row"><span>'+k+'</span><b>'+v+'</b></div>'}
function sidCode(id){return'<code data-use="'+id+'">'+short(id)+'</code>'}
function run(out,fn){show(out,'Working…','ok');Promise.resolve().then(fn).then(function(r){var m=typeof r==='string'?r:'Done. Record added to the chain.';show(out,esc(m),'ok');toast('Saved');rerenderLists()}).catch(function(e){show(out,esc(e.message),'err')})}
function v(i){return $(i).value.trim()}

var FORMS={
 sample:[
  {t:'My samples',s:'Samples in your custody. Tap an ID to use it everywhere.',f:[],b:[['Load my samples',function(o){mine(o)}]],o:'oMine'},
  {t:'Register a new sample',s:'Hospitals, laboratories and research institutions.',f:[['n_label','Sample label / barcode','H-002'],['n_type','Sample type','Whole blood'],['n_date','Collection date','','date'],['n_subject','Pseudonymous subject reference','Study code P-0043'],['n_consent','Consent form hash','0x…','','file'],['n_note','Note (optional)','Collected at ward 3']],w:'Never enter names or national IDs. The subject reference is hashed on your device.',b:[['Register sample',function(o){run(o,function(){return A.register(v('n_label'),v('n_type'),v('n_date'),v('n_subject'),v('n_consent'),v('n_note'))})}]],o:'oReg'},
  {t:'Log storage',f:[['st_id','Sample ID','0x…','','sid'],['st_loc','Location','Freezer A2, shelf 3'],['st_temp','Temperature °C (optional)','-80','number'],['st_note','Note (optional)','']],b:[['Log storage',function(o){run(o,function(){return A.storage(v('st_id'),v('st_loc'),v('st_temp'),v('st_note'))})}]],o:'oSt'},
  {t:'Log handling',f:[['hd_id','Sample ID','0x…','','sid'],['hd_act','Action','Centrifuged / Thawed / Aliquoted'],['hd_note','Details (optional)','10 min @ 2000g']],b:[['Log handling',function(o){run(o,function(){return A.handling(v('hd_id'),v('hd_act'),v('hd_note'))})}]],o:'oHd'},
  {t:'Record a test',s:'Laboratories and research institutions holding the sample.',f:[['ts_id','Sample ID','0x…','','sid'],['ts_name','Test name','Complete blood count'],['ts_hash','Report / result hash','0x…','','file']],b:[['Record test',function(o){run(o,function(){return A.test(v('ts_id'),v('ts_name'),v('ts_hash'))})}]],o:'oTs'},
  {t:'Create aliquot',s:'Split a child sample. It links back to its parent.',f:[['al_id','Parent sample ID','0x…','','sid'],['al_label','New label / barcode','L-001-A'],['al_type','Sample type','Plasma'],['al_note','Note (optional)','500 µL']],b:[['Create aliquot',function(o){run(o,function(){return A.aliquot(v('al_id'),v('al_label'),v('al_type'),v('al_note'))})}]],o:'oAl'},
  {t:'Report an incident',s:'Custodian, receiving party in transit, or an auditor.',f:[['in_id','Sample ID','0x…','','sid'],['in_desc','What happened','Temperature excursion to 8 °C for 40 min'],['in_hash','Evidence hash (optional)','0x…','','file']],b:[['Report incident',function(o){run(o,function(){return A.incident(v('in_id'),v('in_desc'),v('in_hash'))}) },1]],o:'oIn'},
  {t:'End of life',s:'Mark a sample as used up or destroyed. This is final.',f:[['eo_id','Sample ID','0x…','','sid'],['eo_reason','Reason / method','Used in assay']],b:[['Mark consumed',function(o){run(o,function(){return A.consume(v('eo_id'),v('eo_reason'))})},1],['Mark destroyed',function(o){run(o,function(){return A.destroy(v('eo_id'),v('eo_reason'))})},2]],o:'oEo'}],
 custody:[
  {t:'Inbox',s:'Transfers waiting for you to accept or reject.',f:[],b:[['Check inbox',function(o){inbox(o)}]],o:'oInbox'},
  {t:'Send sample',s:'Hand a sample to another organization. They must accept it.',f:[['tr_id','Sample ID','0x…','','sid'],['tr_to','Recipient address','0x…'],['tr_note','Note','Dry ice, AWB 1234']],b:[['Send',function(o){run(o,function(){return A.send(v('tr_id'),v('tr_to'),v('tr_note'))})}],['Cancel pending transfer',function(o){run(o,function(){return A.cancel(v('tr_id'))})},1]],o:'oSend'},
  {t:'Receive sample',f:[['rc_id','Sample ID','0x…','','sid'],['rc_ok','Condition on arrival','','select'],['rc_note','Note','Sealed, 4.1 °C']]
